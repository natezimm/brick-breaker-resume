name: CI & Deploy

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions: {}

# Pinned to Ubuntu 24.04 rather than ubuntu-latest: Playwright 1.60 cannot install Chromium
# on the newer 26.04 image. Move the pin once it can.
jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quality gate
        run: npm run quality

      # The npm packages behind this build, as an SPDX SBOM kept with the run's artifacts.
      - name: SBOM of the shipped packages
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brick-breaker-build
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    # Only what signing the build's provenance needs: GitHub's OIDC identity and the attestation store.
    permissions:
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: brick-breaker-build
          path: site

      # A signed record, per file, that this commit's workflow built what is about to be served.
      # Check a file fetched from the live site with: gh attestation verify index.html --owner natezimm
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'site/**'

      - name: Setup SSH
        env:
          GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -z "$GCP_KNOWN_HOSTS" ]; then
            echo "GCP_KNOWN_HOSTS secret is not set; refusing to connect without a pinned host key"
            exit 1
          fi
          printf '%s\n' "$GCP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat <<SSHCONFIG > ~/.ssh/config
          Host gcp
            HostName ${{ secrets.GCP_HOST }}
            User ${{ secrets.GCP_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
          SSHCONFIG

      - name: Deploy to GCP
        run: |
          rsync -avz --delete site/ gcp:/var/www/brick-breaker/

      - name: Health check
        run: |
          echo "Waiting for site to come up..."
          sleep 6

          curl -f https://${{ secrets.APP_DOMAIN }} || {
            echo "Brick Breaker health check failed"
            exit 1
          }

          echo "Brick Breaker deployed successfully"
